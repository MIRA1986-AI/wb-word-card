<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词盒</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fef6e4 0%, #f3d2c1 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
  }

  /* ===== 密码锁 ===== */
  .lock-box {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(23, 44, 102, 0.15);
    margin-top: 80px;
  }
  .lock-box h2 {
    text-align: center;
    color: #172c66;
    margin-bottom: 8px;
    font-size: 22px;
  }
  .lock-box p {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .lock-box input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 12px;
    outline: none;
  }
  .lock-box input:focus { border-color: #172c66; }
  .lock-box button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #172c66;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .lock-error {
    color: #e74c3c;
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
    min-height: 18px;
  }

  /* ===== 单词卡页面 ===== */
  .app { display: none; width: 100%; max-width: 440px; flex-direction: column; align-items: center; }
  .app.show { display: flex; }

  .header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  h1 { font-size: 20px; color: #172c66; }
  .progress { color: #172c66; font-size: 14px; font-weight: 600; }
  .logout-btn {
    background: none;
    border: none;
    color: #999;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }

  .controls {
    width: 100%;
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  button {
    flex: 1;
    padding: 10px 12px;
    border: none;
    border-radius: 10px;
    background: #172c66;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }
  button:hover { transform: translateY(-1px); }
  button.secondary { background: #fff; color: #172c66; border: 2px solid #172c66; }
  button.active { background: #f582ae; border-color: #f582ae; color: #fff; }

  .card-container {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 3 / 4;
    perspective: 1500px;
    cursor: pointer;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(23, 44, 102, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .face img { max-width: 88%; max-height: 78%; object-fit: contain; }
  .back { transform: rotateY(180deg); }

  .back .word {
    font-size: 56px;
    font-weight: 700;
    color: #172c66;
    letter-spacing: 1px;
  }
  .back .meaning {
    font-size: 24px;
    color: #f582ae;
    margin-top: 14px;
    font-weight: 500;
  }

  .front-word {
    font-size: 60px;
    font-weight: 700;
    color: #172c66;
  }
  .front-hint {
    margin-top: 18px;
    font-size: 14px;
    color: #aaa;
  }

  .nav {
    width: 100%;
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .nav button { padding: 14px; font-size: 16px; }

  .tip {
    margin-top: 14px;
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>

<!-- 密码锁 -->
<div class="lock-box" id="lockBox">
  <h2>📚 单词盒</h2>
  <p>请输入密码进入</p>
  <input type="password" id="passwordInput" placeholder="密码">
  <button id="unlockBtn">进 入</button>
  <div class="lock-error" id="lockError"></div>
</div>

<!-- 单词卡页面 -->
<div class="app" id="app">
  <div class="header">
    <h1>📚 单词盒</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="progress" id="progress">1 / 7</div>
      <button class="logout-btn" id="logoutBtn">退出</button>
    </div>
  </div>

  <div class="controls">
    <button id="reverseBtn" class="secondary">🔄 反向测试</button>
    <button id="shuffleBtn" class="secondary">🔀 乱序重排</button>
  </div>

  <div class="card-container" id="cardContainer">
    <div class="card" id="card">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>

  <div class="nav">
    <button id="prevBtn">← 上一张</button>
    <button id="nextBtn">下一张 →</button>
  </div>

  <div class="tip">点卡片翻面并朗读 · ← → 切换</div>
</div>

<script>
// ===== 密码锁设置（改这里）=====
const PASSWORD = 'wb2026';

// ===== 单词数据（加卡片在这里）=====
const words = [
  { en: 'sun',    zh: '太阳', img: 'sun.png' },
  { en: 'tree',   zh: '树',   img: 'tree.png' },
  { en: 'river',  zh: '河流', img: 'river.png' },
  { en: 'cat',    zh: '猫',   img: 'cat.png' },
  { en: 'dog',    zh: '狗',   img: 'dog.png' },
  { en: 'pig',    zh: '猪',   img: 'pig.png' },
  { en: 'flower', zh: '花',   img: 'flower.png' },
];

let order = words.map((_, i) => i);
let current = 0;
let reversedMode = false;

const card = document.getElementById('card');
const front = document.getElementById('front');
const back = document.getElementById('back');
const progress = document.getElementById('progress');
const reverseBtn = document.getElementById('reverseBtn');
const lockBox = document.getElementById('lockBox');
const app = document.getElementById('app');
const lockError = document.getElementById('lockError');

// ===== 密码锁逻辑 =====
function unlock() {
  const pwd = document.getElementById('passwordInput').value;
  if (pwd === PASSWORD) {
    localStorage.setItem('wordcard_unlocked', '1');
    lockBox.style.display = 'none';
    app.classList.add('show');
    render();
  } else {
    lockError.textContent = '密码错误';
  }
}

function lock() {
  localStorage.removeItem('wordcard_unlocked');
  app.classList.remove('show');
  lockBox.style.display = 'block';
  document.getElementById('passwordInput').value = '';
}

document.getElementById('unlockBtn').addEventListener('click', unlock);
document.getElementById('passwordInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') unlock();
});
document.getElementById('logoutBtn').addEventListener('click', lock);

// 页面加载时检查是否已解锁
if (localStorage.getItem('wordcard_unlocked') === '1') {
  lockBox.style.display = 'none';
  app.classList.add('show');
  render();
}

// ===== 发音 =====
function speak(text) {
  try {
    const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2';
    const audio = new Audio(url);
    audio.play().catch(function(e) {});
  } catch (e) {}
}

// ===== 卡片渲染 =====
function render() {
  const w = words[order[current]];
  card.style.transition = 'none';
  card.classList.remove('flipped');
  card.offsetHeight;
  card.style.transition = '';
  progress.textContent = (current + 1) + ' / ' + order.length;

  if (reversedMode) {
    front.innerHTML =
      '<div class="front-word">' + w.en + '</div>' +
      '<div class="front-hint">点击看图和中文</div>';
    back.innerHTML =
      '<img src="' + w.img + '" alt="' + w.en + '">' +
      '<div class="meaning" style="margin-top:14px;color:#f582ae;font-size:24px;font-weight:500">' + w.zh + '</div>';
  } else {
    front.innerHTML =
      '<img src="' + w.img + '" alt="' + w.en + '">' +
      '<div class="meaning" style="margin-top:14px;color:#f582ae;font-size:24px;font-weight:500">' + w.zh + '</div>';
    back.innerHTML =
      '<div class="word">' + w.en + '</div>';
  }
}

document.getElementById('cardContainer').addEventListener('click', () => {
  card.classList.toggle('flipped');
  const w = words[order[current]];
  speak(w.en);
});

document.getElementById('prevBtn').addEventListener('click', () => {
  current = (current - 1 + order.length) % order.length;
  render();
});

document.getElementById('nextBtn').addEventListener('click', () => {
  current = (current + 1) % order.length;
  render();
});

document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  current = 0;
  render();
});

reverseBtn.addEventListener('click', () => {
  reversedMode = !reversedMode;
  reverseBtn.classList.toggle('active', reversedMode);
  render();
});
</script>

</body>
</html>
