<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fef6e4 0%, #f3d2c1 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
  }

  /* ===== 密码锁 ===== */
  .lock-box {
    width: 100%; max-width: 360px; background: #fff;
    border-radius: 20px; padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(23, 44, 102, 0.15); margin-top: 80px;
  }
  .lock-box h2 { text-align: center; color: #172c66; margin-bottom: 8px; font-size: 22px; }
  .lock-box p { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
  .lock-box input {
    width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 10px;
    font-size: 16px; margin-bottom: 12px; outline: none;
  }
  .lock-box input:focus { border-color: #172c66; }
  .lock-box button {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: #172c66; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .lock-error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }

  /* ===== 单词卡页面 ===== */
  .app { display: none; width: 100%; max-width: 440px; flex-direction: column; align-items: center; }
  .app.show { display: flex; }

  .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  h1 { font-size: 20px; color: #172c66; }
  .progress { color: #172c66; font-size: 14px; font-weight: 600; }
  .logout-btn { background: none; border: none; color: #999; font-size: 13px; cursor: pointer; text-decoration: underline; }

  .controls { width: 100%; display: flex; gap: 8px; margin-bottom: 18px; }
  button {
    flex: 1; padding: 10px 12px; border: none; border-radius: 10px;
    background: #172c66; color: #fff; font-size: 14px; cursor: pointer;
    font-weight: 600; transition: all 0.15s;
  }
  button:hover { transform: translateY(-1px); }
  button.secondary { background: #fff; color: #172c66; border: 2px solid #172c66; }
  button.active { background: #f582ae; border-color: #f582ae; color: #fff; }
  button.starred { background: #ffd93d; border-color: #ffd93d; color: #172c66; }

  .card-container {
    width: 100%; max-width: 400px; aspect-ratio: 3 / 4;
    perspective: 1500px; cursor: pointer;
  }
  .card {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(23, 44, 102, 0.15);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
  }
  .face img { max-width: 88%; max-height: 78%; object-fit: contain; }
  .back { transform: rotateY(180deg); }
  .back .word { font-size: 56px; font-weight: 700; color: #172c66; letter-spacing: 1px; }
  .back .meaning { font-size: 24px; color: #f582ae; margin-top: 14px; font-weight: 500; }
  .front-word { font-size: 60px; font-weight: 700; color: #172c66; }
  .front-hint { margin-top: 18px; font-size: 14px; color: #aaa; }

  .nav { width: 100%; display: flex; gap: 8px; margin-top: 20px; }
  .nav button { padding: 14px; font-size: 15px; }

  .tip { margin-top: 14px; font-size: 12px; color: #888; }

  /* ===== 笔记本页面 ===== */
  .notebook {
    display: none; width: 100%; max-width: 440px; flex-direction: column; align-items: center;
  }
  .notebook.show { display: flex; }
  .nb-empty { text-align: center; color: #aaa; margin-top: 60px; font-size: 15px; }
  .nb-nav { width: 100%; display: flex; gap: 8px; margin-top: 20px; }
  .nb-nav button { padding: 14px; font-size: 15px; }
  .nb-progress { color: #172c66; font-size: 14px; font-weight: 600; margin-top: 10px; }
  .nb-top { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .nb-back { background: none; border: none; color: #172c66; font-size: 14px; cursor: pointer; text-decoration: underline; }
</style>
</head>

<!-- 密码锁 -->
<div class="lock-box" id="lockBox">
  <h2>📚 单词盒</h2>
  <p>请输入密码进入</p>
  <input type="password" id="passwordInput" placeholder="密码">
  <button id="unlockBtn">进 入</button>
  <div class="lock-error" id="lockError"></div>
</div>

<!-- 单词卡页面 -->
<div class="app" id="app">
  <div class="header">
    <h1>📚 单词盒</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="progress" id="progress">1 / 7</div>
      <button class="logout-btn" id="logoutBtn">退出</button>
    </div>
  </div>

  <div class="controls">
    <button id="reverseBtn" class="secondary">🔄 正向测试</button>
    <button id="shuffleBtn" class="secondary">🔀 乱序重排</button>
    <button id="notebookBtn" class="secondary">📓 笔记本</button>
  </div>

  <div class="card-container" id="cardContainer">
    <div class="card" id="card">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>

  <div class="nav">
    <button id="prevBtn">← 上一张</button>
    <button id="starBtn" class="secondary">☆ 收藏</button>
    <button id="nextBtn">下一张 →</button>
  </div>

  <div class="tip">点卡片翻面并朗读 · ← → 切换</div>
</div>

<!-- 笔记本页面 -->
<div class="notebook" id="notebook">
  <div class="nb-top">
    <h1>📓 笔记本</h1>
    <div class="nb-progress" id="nbProgress"></div>
  </div>

  <div class="controls" style="margin-top:14px" id="nbControls">
    <button id="nbReverseBtn" class="secondary">🔄 正向测试</button>
    <button id="nbShuffleBtn" class="secondary">🔀 乱序重排</button>
  </div>

  <div id="nbEmpty" class="nb-empty">还没有收藏的单词<br>点卡片下方的 ☆ 收藏按钮加入</div>

  <div class="card-container" id="nbCardContainer" style="display:none">
    <div class="card" id="nbCard">
      <div class="face front" id="nbFront"></div>
      <div class="face back" id="nbBack"></div>
    </div>
  </div>

  <div class="nb-nav" id="nbNav" style="display:none">
    <button id="nbPrevBtn">← 上一张</button>
    <button id="backBtn" class="secondary">返回</button>
    <button id="nbNextBtn">下一张 →</button>
  </div>
</div>

let order = words.map((_, i) => i);
let current = 0;
let reversedMode = false;
let favorites = JSON.parse(localStorage.getItem('wordcard_favs') || '[]');

const card = document.getElementById('card');
const front = document.getElementById('front');
const back = document.getElementById('back');
const progress = document.getElementById('progress');
const reverseBtn = document.getElementById('reverseBtn');
const lockBox = document.getElementById('lockBox');
const app = document.getElementById('app');
const notebook = document.getElementById('notebook');
const notebookList = document.getElementById('notebookList');
const starBtn = document.getElementById('starBtn');

// ===== 密码锁逻辑 =====
function unlock() {
  const pwd = document.getElementById('passwordInput').value;
  if (pwd === PASSWORD) {
    localStorage.setItem('wordcard_unlocked', '1');
    lockBox.style.display = 'none';
    app.classList.add('show');
    render();
  } else {
    document.getElementById('lockError').textContent = '密码错误';
  }
}

function lock() {
  localStorage.removeItem('wordcard_unlocked');
  app.classList.remove('show');
  notebook.classList.remove('show');
  lockBox.style.display = 'block';
  document.getElementById('passwordInput').value = '';
}

document.getElementById('unlockBtn').addEventListener('click', unlock);
document.getElementById('passwordInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
document.getElementById('logoutBtn').addEventListener('click', lock);

// ===== 发音 =====
function speak(text) {
  try {
    const clean = text.replace(/_/g, ' ');
    const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(clean) + '&type=2';
    const audio = new Audio(url);
    audio.play().catch(function(e) {});
  } catch (e) {}
}

// 显示用：下划线换成换行，超长单词自动缩小
function displayName(text) {
  if (text.indexOf('_') !== -1) {
    return text.replace(/_/g, '<br>');
  }
  const len = text.length;
  let size = 56;
  if (len > 12) size = 28;
  else if (len > 9) size = 36;
  else if (len > 7) size = 44;
  return '<div style="font-size:' + size + 'px">' + text + '</div>';
}

// ===== 收藏 =====
function saveFavs() { localStorage.setItem('wordcard_favs', JSON.stringify(favorites)); }
function isFav(en) { return favorites.indexOf(en) !== -1; }

function toggleStar() {
  const w = words[order[current]];
  if (isFav(w.en)) {
    favorites = favorites.filter(x => x !== w.en);
  } else {
    favorites.push(w.en);
  }
  saveFavs();
  updateStarBtn();
}

function updateStarBtn() {
  const w = words[order[current]];
  if (isFav(w.en)) {
    starBtn.textContent = '★ 已收藏';
    starBtn.classList.add('starred');
  } else {
    starBtn.textContent = '☆ 收藏';
    starBtn.classList.remove('starred');
  }
}

// ===== 笔记本 =====
let nbCurrent = 0;
let nbOrder = [];
let nbReversed = false;

function showNotebook() {
  app.classList.remove('show');
  notebook.classList.add('show');
  nbOrder = favorites.slice();
  nbCurrent = 0;
  nbReversed = false;
  updateNbReverseBtn();
  renderNotebook();
}

function renderNotebook() {
  const empty = document.getElementById('nbEmpty');
  const cardC = document.getElementById('nbCardContainer');
  const nav = document.getElementById('nbNav');
  const prog = document.getElementById('nbProgress');
  const controls = document.getElementById('nbControls');

  if (favorites.length === 0) {
    empty.style.display = 'block';
    cardC.style.display = 'none';
    nav.style.display = 'none';
    controls.style.display = 'none';
    prog.textContent = '';
    return;
  }
  empty.style.display = 'none';
  cardC.style.display = 'block';
  nav.style.display = 'flex';
  controls.style.display = 'flex';
  prog.textContent = (nbCurrent + 1) + ' / ' + nbOrder.length;

  const en = nbOrder[nbCurrent];
  const w = words.find(x => x.en === en);
  const card = document.getElementById('nbCard');
  card.style.transition = 'none';
  card.classList.remove('flipped');
  card.offsetHeight;
  card.style.transition = '';

  if (nbReversed) {
    document.getElementById('nbFront').innerHTML =
      '<div class="front-word">' + displayName(w.en) + '</div>' +
      '<div class="front-hint">点击看图和中文</div>';
    document.getElementById('nbBack').innerHTML =
      '<img src="' + w.img + '" alt="' + w.en + '">' +
      '<div class="meaning">' + w.zh + '</div>';
  } else {
    document.getElementById('nbFront').innerHTML =
      '<img src="' + w.img + '" alt="' + w.en + '">' +
      '<div class="meaning">' + w.zh + '</div>';
    document.getElementById('nbBack').innerHTML =
      '<div class="word">' + displayName(w.en) + '</div>';
  }
}

function updateNbReverseBtn() {
  const btn = document.getElementById('nbReverseBtn');
  if (nbReversed) {
    btn.textContent = '🔄 反向测试';
    btn.classList.add('active');
  } else {
    btn.textContent = '🔄 正向测试';
    btn.classList.remove('active');
  }
}

document.getElementById('nbReverseBtn').addEventListener('click', () => {
  nbReversed = !nbReversed;
  updateNbReverseBtn();
  renderNotebook();
});

document.getElementById('nbShuffleBtn').addEventListener('click', () => {
  for (let i = nbOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [nbOrder[i], nbOrder[j]] = [nbOrder[j], nbOrder[i]];
  }
  nbCurrent = 0;
  renderNotebook();
});

// ===== 手势滑动（笔记本）=====
document.getElementById('nbCardContainer').addEventListener('click', () => {
  document.getElementById('nbCard').classList.toggle('flipped');
  const en = nbOrder[nbCurrent];
  const w = words.find(x => x.en === en);
  speak(w.en);
});

document.getElementById('nbPrevBtn').addEventListener('click', () => {
  nbCurrent = (nbCurrent - 1 + nbOrder.length) % nbOrder.length;
  renderNotebook();
});
document.getElementById('nbNextBtn').addEventListener('click', () => {
  nbCurrent = (nbCurrent + 1) % nbOrder.length;
  renderNotebook();
});

document.getElementById('notebookBtn').addEventListener('click', showNotebook);
document.getElementById('backBtn').addEventListener('click', () => {
  notebook.classList.remove('show');
  app.classList.add('show');
});
starBtn.addEventListener('click', toggleStar);

// ===== 卡片渲染 =====
function render() {
  const w = words[order[current]];
  card.style.transition = 'none';
  card.classList.remove('flipped');
  card.offsetHeight;
  card.style.transition = '';
  progress.textContent = (current + 1) + ' / ' + order.length;

  if (reversedMode) {
    front.innerHTML =
      '<div class="front-word">' + displayName(w.en) + '</div>' +
      '<div class="front-hint">点击看图和中文</div>';
    back.innerHTML =
      '<img src="' + w.img + '" alt="' + w.en + '">' +
      '<div class="meaning">' + w.zh + '</div>';
  } else {
    front.innerHTML =
      '<img src="' + w.img + '" alt="' + w.en + '">' +
      '<div class="meaning">' + w.zh + '</div>';
    back.innerHTML = '<div class="word">' + displayName(w.en) + '</div>';
  }
  updateStarBtn();
}

// ===== 卡片点击翻面 =====
document.getElementById('cardContainer').addEventListener('click', () => {
  card.classList.toggle('flipped');
  const w = words[order[current]];
  speak(w.en);
});

document.getElementById('prevBtn').addEventListener('click', () => {
  current = (current - 1 + order.length) % order.length;
  render();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  current = (current + 1) % order.length;
  render();
});
document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  current = 0;
  render();
});

reverseBtn.addEventListener('click', () => {
  reversedMode = !reversedMode;
  updateReverseBtn();
  render();
});

function updateReverseBtn() {
  if (reversedMode) {
    reverseBtn.textContent = '🔄 反向测试';
    reverseBtn.classList.add('active');
  } else {
    reverseBtn.textContent = '🔄 正向测试';
    reverseBtn.classList.remove('active');
  }
}



// 页面加载时检查是否已解锁
updateReverseBtn();
if (localStorage.getItem('wordcard_unlocked') === '1') {
  lockBox.style.display = 'none';
  app.classList.add('show');
  render();
}
</script>
